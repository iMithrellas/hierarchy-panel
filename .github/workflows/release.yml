name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GRAFANA_PLUGIN_RELEASE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python3 -m unittest discover -s .github/scripts -v
      - name: Detect signing configuration
        id: signing
        run: |
          if [ -n "$POLICY_TOKEN" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi
        env:
          POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
      - name: Refuse unsigned rerun of a stable release
        if: ${{ steps.signing.outputs.enabled != 'true' }}
        run: python3 .github/scripts/check_unsigned_release_preflight.py "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
      # Use the packaging action directly at an immutable revision. The build-plugin
      # wrapper's package-plugin@main dependency is mutable and cannot be pinned by
      # pinning the wrapper itself.
      - uses: grafana/plugin-actions/package-plugin@57cc2ad74da580b805030081f1686b90eb76d345 # pinned package-plugin source
        id: package
        with:
          policy_token: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
          node-version: '22'
      - name: Verify archive metadata and signed manifest
        run: python3 .github/scripts/verify_release_archive.py "$PLUGIN_ARCHIVE" "$PLUGIN_ID" "$GITHUB_REF_NAME" "$REQUIRE_SIGNATURE"
        env:
          PLUGIN_ARCHIVE: ${{ steps.package.outputs.archive }}
          PLUGIN_ID: ${{ steps.package.outputs.plugin-id }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          REQUIRE_SIGNATURE: ${{ steps.signing.outputs.enabled }}
      - name: Validate plugin archive
        run: npx --yes @grafana/plugin-validator@0.49.5 "$PLUGIN_ARCHIVE"
        env:
          PLUGIN_ARCHIVE: ${{ steps.package.outputs.archive }}
      - name: Require valid public Grafana signature
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        run: npx --yes @grafana/plugin-validator@0.49.5 -analyzer signature -strict "$PLUGIN_ARCHIVE"
        env:
          PLUGIN_ARCHIVE: ${{ steps.package.outputs.archive }}
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: ${{ steps.package.outputs.archive }}
      - uses: softprops/action-gh-release@62c96d0c4e8a889135c1f3a25910db8dbe0e85f7 # v2.3.4
        with:
          # Keep every upload (including signed asset replacement) non-stable until
          # the new public assets have been downloaded and compared below.
          draft: false
          prerelease: true
          make_latest: false
          overwrite_files: true
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive-sha1sum }}
          body: |
            This release contains the plugin archive and SHA1 checksum.
            This prerelease remains non-stable until signed assets have been uploaded and
            verified as publicly downloadable.
      - name: Verify publicly served signed release assets
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        id: public-assets
        run: |
          RELEASE_ID=$(python3 .github/scripts/verify_public_release_assets.py \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$PLUGIN_ARCHIVE" "$PLUGIN_SHA1")
          echo "release-id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          PLUGIN_ARCHIVE: ${{ steps.package.outputs.archive }}
          PLUGIN_SHA1: ${{ steps.package.outputs.archive-sha1sum }}
      - name: Promote verified signed release to stable
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_ID: ${{ steps.public-assets.outputs.release-id }}
        run: gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F prerelease=false -f make_latest=true
