name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GRAFANA_PLUGIN_RELEASE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Detect signing configuration
        id: signing
        run: |
          if [ -n "$POLICY_TOKEN" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi
        env:
          POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
      # Use the packaging action directly at an immutable revision. The build-plugin
      # wrapper's package-plugin@main dependency is mutable and cannot be pinned by
      # pinning the wrapper itself.
      - uses: grafana/plugin-actions/package-plugin@57cc2ad74da580b805030081f1686b90eb76d345 # pinned package-plugin source
        id: package
        with:
          policy_token: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
          node-version: '22'
      - name: Require a signed manifest when a signing token is configured
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        run: |
          test -f "$PLUGIN_ID/MANIFEST.txt" || { echo 'Signed MANIFEST.txt is missing'; exit 1; }
          grep -Eiq '^signature: .+' "$PLUGIN_ID/MANIFEST.txt" || { echo 'MANIFEST.txt has no signature'; exit 1; }
        env:
          PLUGIN_ID: ${{ steps.package.outputs.plugin-id }}
      - name: Validate plugin archive
        run: npx --yes @grafana/plugin-validator@0.49.5 "$PLUGIN_ARCHIVE"
        env:
          PLUGIN_ARCHIVE: ${{ steps.package.outputs.archive }}
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: ${{ steps.package.outputs.archive }}
      - uses: softprops/action-gh-release@62c96d0c4e8a889135c1f3a25910db8dbe0e85f7 # v2.3.4
        with:
          draft: true
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive-sha1sum }}
          body: |
            This draft contains the plugin archive and SHA1 checksum for Grafana submission.
            When Grafana approves signing, configure the GRAFANA_ACCESS_POLICY_TOKEN secret
            and rerun this workflow for this tag. The resulting archive must pass signed MANIFEST validation before publication.
